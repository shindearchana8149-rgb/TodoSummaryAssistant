version: '3.8'
services:
  backend:
    build: ./TodoSummaryAssistant-main/Backend/todo-summary-assistant
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
  frontend:
    build: ./TodoSummaryAssistant-main/Frontend/todo
    ports:
      - "3000:80"
    depends_on:
      - backend
