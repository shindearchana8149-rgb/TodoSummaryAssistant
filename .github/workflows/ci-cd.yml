name: CI-CD Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Backend
        working-directory: TodoSummaryAssistant-main/Backend/todo-summary-assistant
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Build Frontend
        working-directory: TodoSummaryAssistant-main/Frontend/todo
        run: |
          npm ci
          npm run build
      - name: Build Backend Docker
        run: docker build -t todo-backend ./TodoSummaryAssistant-main/Backend/todo-summary-assistant
      - name: Build Frontend Docker
        run: docker build -t todo-frontend ./TodoSummaryAssistant-main/Frontend/todo
